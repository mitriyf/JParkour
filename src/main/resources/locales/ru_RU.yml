# Не удалять настройку version.
version: 1.7

# Настройка сообщений.
messages:
  # Действия:
  # [actionbar] сообщение - Отправить сообщение в actionbar. Для версии 1.11+
  # [connect] сервер - Отправить игрока на конкретный сервер BungeeCord.
  # ПРЕДУПРЕЖДЕНИЕ: Требуется BungeeMessaging. Это присутствует на BungeeCord и WaterFall.
  # На Velocity это может быть отключено по умолчанию. Проверьте конфигурацию вашего прокси.
  # [message] сообщение - Отправить сообщение игроку.
  # [party] сообщение - Отправить сообщение игрокам пати.
  # [room] сообщение - Отправить сообщение игрокам комнаты.
  # [broadcast] сообщение - Отправить сообщение всем игрокам.
  # [log] сообщение - Отправить сообщение в консоль.
  # [delay] тики - Сделать задержку между действиями. В тиках. (20 тиков = 1 секунда)
  # [player] сообщение - Выполнить сообщение от имени игрока. (или команду через /)
  # [teleport] мир;x;y;z;рыскание;тангаж;задержка - Телепортировать игрока в указанные координаты. Задержка измеряется в тиках.
  # [console] команда - Выполнить команду от имени консоли.
  # [title] заголовок;подзаголовок;fadeIn;показ;fadeOut - Отправить заголовок игроку. Для версии 1.8+
  # [sound] звук;громкость;высота;задержка - Воспроизвести звук для игрока. Задержка измеряется в тиках.
  # Ищите звуки здесь: https://helpch.at/docs/$version$/org/bukkit/Sound.html
  # // Замените $version$ на версию вашего сервера, например: https://helpch.at/docs/1.8.8/org/bukkit/Sound.html
  # [effect] тип;длительность;усиление;задержка - Дать эффект игроку. Задержка и длительность измеряются в тиках.
  # Найдите типы эффектов здесь: https://helpch.at/docs/$version$/org/bukkit/potion/PotionEffectType.html
  # [explosion] мощность;setFire;breakBlocks;задержка;addX;addY;addZ - Создать взрыв. Задержка измеряется в тиках.
  # setFire, breakBlocks - установить false или true. addX, addY, addZ - значения double, добавляемые к позиции взрыва игрока.
  # [bossbar] сообщение;цвет;тип;время;стиль;флаг - Отправить босс-бар игроку с сообщением на определённое время. Для версии 1.9+
  # Типы:
  # stop - Босс-бар исчезнет через указанное время (в секундах)
  # time - Босс-бар будет анимировать время, которое истекает.
  # Функции:
  # %time% - Оставшиеся секунды.
  # Вы можете найти все функции, такие как цвет, стиль и флаг, здесь: https://helpch.at/docs/$version$/org/bukkit/boss/BossBar.html
  #
  # Плейсхолдеры:
  # %jparkour_map% - Отображает название карты.
  # %jparkour_id% - Отображает ID карты.
  # %jparkour_playerid% - Отображает ID игрока.
  # %jparkour_status% - Отображает статус карты.
  # %jparkour_lefts% - Отображает количество кликов по стойке.
  # %jparkour_maxlefts% - Отображает максимальное количество кликов по стойке.
  # %jparkour_rights% - Отображает количество кликов по бомбе.
  # %jparkour_maxrights% - Отображает максимальное количество кликов по бомбе.
  # %jparkour_tops_SchematicName_Number_name% - Получить имя игрока, находящегося на определённом месте в топе.
  # %jparkour_tops_SchematicName_Number_top% - Получить место игрока в топе.
  # %jparkour_tops_SchematicName_Number_accuracy% - Получить точность игрока, находящегося на определённом месте в топе.
  # %jparkour_tops_SchematicName_Number_time% - Получить точное время прохождения игрока, находящегося на определённом месте в топе.
  #
  # Замените "SchematicName" на ID схемы, а "Number" на номер места в топе, которое вам нужно.
  # Если вы не знаете позицию игрока в топе, вы можете получить её, заменив "Number" на "name=ИмяИгрока".
  # Или если вы хотите узнать позицию человека, который смотрит на плейсхолдер, замените "Number" на "player".
  # Введите никнейм игрока в ИмяИгрока. Примеры: %jparkour_tops_nether_1_top%,
  # %jparkour_tops_nether_name=Mitriyf_accuracy%, %jparkour_tops_nether_name=%player%_time%, %jparkour_tops_nether_player_name%.
  # Внимание! Функция "name=ИмяИгрока" может работать некорректно с именами, содержащими _
  #
  # Встроенные плейсхолдеры:
  # %accuracy% - Отображает точность выполнения игрока.
  # %star_win% - Отображает звёзды, которые игрок заработал.
  # %star_loss% - Отображает звёзды, которые игрок не заработал.
  #
  # Информация:
  # Сообщения, отправленные в консоль, могут не заменять плейсхолдеры или выполнять некоторые действия выше.
  # Встроенные функции:
  # %player% - Получить имя игрока.
  #
  # Сообщения команд.
  game:
    # Вы не можете использовать действия в статусах и плейсхолдерах.
    status:
      wait: "&eОжидание"
      start: "&fИгра"
      win: "&aПобеда"
      left: "&fБлоков уничтожено: &e%blocks%/%blocks_all%"
      right: "&fБомб отражено: &e%bombs%/%bombs_all%"
    placeholders:
      notClaimed: "Не получено"
    actions:
      command:
        help:
          - "[message] &a[JParkour] Помощь &7(/jparkour help):"
          - ""
          - "[message] &a/jparkour status &f- Проверить статус плагина."
          - "[message] &a/jparkour join &f- Создать или присоединиться к любой доступной комнате."
          - "[message] &a/jparkour join roomId &f- Попытаться подключиться к комнате (если она свободна)."
          - "[message] &a/jparkour exit &f- Выйти из игры/очереди."
          - "[message] &a/jparkour party &f- Получить помощь по пати."
          - "[message] &a/jparkour admin &f- Получить помощь по администрированию."
          - "[message] &a/jparkour reload &f- Перезагрузить конфигурацию плагина."
          - ""
        party:
          help:
            - "[message] [JParkour] Помощь по пати &7(/jparkour party help):"
            - "[message] &a/jparkour party info &f- Информация о пати."
            - "[message] &a/jparkour party create Название &f- Создать пати с названием."
            - "[message] &a/jparkour party setLeader ИмяИгрока &f- Передать лидерство."
            - "[message] &a/jparkour party disband &f- Удалить вашу пати."
            - "[message] &a/jparkour party invite ИмяИгрока &f- Пригласить игрока."
            - "[message] &a/jparkour party kick ИмяИгрока &f- Исключить игрока."
            - "[message] &a/jparkour party leave &f- Покинуть пати."
            - "[message] &a/jparkour party accept НазваниеПати &f- Принять приглашение."
            - "[message] &a/jparkour party deny НазваниеПати &f- Отклонить приглашение в пати."
          info:
            - "[message] &aИнформация о пати:"
            - "[message] &fНазвание пати: &e%party%"
            - "[message] &eЛидер: &a%leader%"
            - "[message] &aУчастники: &f%members%"
        noperm:
          - "[message] &cУ вас недостаточно прав!"
      room:
        notfound:
          - "[message] &cЭта карта не существует."
        started:
          - "[message] &cИгра уже началась."
        connect:
          - "[party] &aПодключение к комнате &e%room%..."
        waiter:
          - "[party] &aВы были помещены в очередь."
          - "[party] &fВыйти из очереди: &c/jparkour exit"
        exit:
          - "[message] &cВы вышли из очереди."
        noExit:
          - "[message] &cВы не в игре."
      party:
        newLeader:
          - "[party] &fНовый лидер назначен в пати: &e%leader%"
        playerLeaved:
          - "[party] &cИгрок %player% покинул пати."
        joinedToParty:
          - "[party] &aИгрок %player% присоединился к пати."
        kickedFromParty:
          - "[party] &cИгрок %player% был исключён из пати."
        partyBroken:
          - "[party] &cЭта пати распалась."
        alreadyLeader:
          - "[message] &cВы уже являетесь лидером пати."
        playerNotInParty:
          - "[message] &cЭтот игрок не в вашей пати."
        playerNotFound:
          - "[message] &cНа сервере нет такого игрока."
        haveCreated:
          - "[message] &cВы уже создали пати."
        alreadyCreated:
          - "[message] &cПати с таким названием уже существует."
        partyCreated:
          - "[message] &aПати с названием &e%party%&a была успешно создана."
        notLeader:
          - "[message] &cВы не являетесь лидером пати."
        notInParty:
          - "[message] &cВы не состоите в пати."
        inParty:
          - "[message] &cИгрок уже состоит в пати."
        leaderSendRequest:
          - "[message] &aПриглашение было отправлено игроку."
        alreadySendRequest:
          - "[message] &cВы уже отправили приглашение этому игроку."
        playerGetRequest:
          - "[message] &fИгрок &e%leader% &fотправил вам приглашение в свою пати &e%party%&f."
          - "[message] &fЧтобы принять его, отправьте в чат следующее сообщение: &a/jparkour party accept %party%"
          - "[message] &fЧтобы отклонить приглашение, напишите: &c/jparkour party deny %party%"
          - "[message] &eУ вас есть 30 секунд, чтобы принять приглашение."
        playerTimeLeaved:
          - "[message] &cВы не успели принять приглашение в %party%"
        leaderTimeLeaved:
          - "[message] &cИгрок %player% не ответил на ваше приглашение."
        noHaveInvites:
          - "[message] &cУ вас нет никаких приглашений."
        dontHaveInvite:
          - "[message] &cУ вас нет этого приглашения."
        playerDenyInvite:
          - "[message] &cВы отклонили приглашение в %party%"
        deniedInviteParty:
          - "[message] &cИгрок %player% отклонил ваше приглашение."
        bigSize:
          - "[party] &cВаша пати слишком велика, чтобы войти на эту карту."
      game:
        joined:
          - "[message] &aВы подключены к игре: &e%game%"
          - "[room] &e%player% &aподключился."
        started:
          - "[message] &eИгра началась."
        ingame:
          - "[message] &cВы в игре!"
        end:
          - "[message] &cИгра окончена."
        restarted:
          - "[delay] 5"
          - "[message] &aИгра была перезапущена."
        cooldownRestart:
          - "[message] &cВы не можете так быстро перезагрузить игру."
        kicked:
          - "[message] &cИгра окончена."
        damageHeart:
          - "[message] &c-1 &l♥"
          - "[explosion] 1"
        win:
          - "[title] &aПобеда;&e%star_win%&7%star_loss% &f- &e%accuracy%%"
          - "[room] &a%player% &f| &e%star_win%&7%star_loss% &f- &e%accuracy%%"